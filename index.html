
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101510">
  <title>たのしいよ | Minecraft MODPACK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #203a25 0%, transparent 55%),
        #0b0e0c;
      color: #f1f5f1;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .tag {
      display: inline-block;
      border: 1px solid #507b55;
      color: #a8e6af;
      padding: 7px 13px;
      border-radius: 4px;
      font-size: 12px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(42px, 9vw, 76px);
      margin: 24px 0 8px;
      letter-spacing: 4px;
    }

    .subtitle {
      color: #a6b5a8;
      margin-bottom: 36px;
    }

    .panel {
      background: rgba(21, 29, 23, 0.95);
      border: 1px solid #344b38;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 20px 70px #0008;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 23px;
    }

    .description {
      color: #b9c4bb;
      line-height: 1.9;
      font-size: 14px;
    }

    .download {
      display: block;
      margin-top: 26px;
      padding: 17px 20px;
      border-radius: 6px;
      background: #48a653;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s, transform 0.2s;
    }

    .download:hover {
      background: #5bc668;
      transform: translateY(-2px);
    }

    .steps {
      text-align: left;
      line-height: 2;
      color: #c4cec5;
      font-size: 14px;
      margin-top: 28px;
    }

    .steps strong {
      color: #a8e6af;
    }

    footer {
      color: #748078;
      font-size: 12px;
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <main class="container">
    <span class="tag">MINECRAFT MODPACK</span>

    <h1>たのしいよ</h1>
    <p class="subtitle">いつものMinecraftを、もっと楽しく。</p>

    <section class="panel">
      <h2>MODPACK DOWNLOAD</h2>

      <p class="description">
        友達と遊ぶためのMinecraft MODパック。<br>
        CurseForge形式のZIPをダウンロードして導入しよう。
      </p>

      <!-- 公開後、下のURLをGitHub ReleasesのZIPのURLに変更 -->
      <a
        class="download"
        href="https://github.com/YOUR-NAME/YOUR-REPO/releases/latest"
      >
        ↓ MODパックをダウンロード
      </a>

      <div class="steps">
        <strong>導入方法</strong><br>
        1. 上のボタンからZIPをダウンロード<br>
        2. CurseForgeアプリを開く<br>
        3. Minecraftの画面で「Import」または「インポート」を選ぶ<br>
        4. ダウンロードしたZIPを選択して導入
      </div>
    </section>

    <footer>
      たのしいよ MODPACK · Minecraft Java Edition
    </footer>
  </main>
</body>
</html>
